[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "typst-forge"
version = "0.1.0"
description = "A local manager for Typst templates and packages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
typst-forge = "typst_forge.cli:main"

[tool.setuptools]
package-dir = {"" = "tooling"}

[tool.setuptools.packages.find]
where = ["tooling"]
include = ["typst_forge", "typst_forge.*"]
exclude = ["typst_forge.tests", "typst_forge.tests.*"]
