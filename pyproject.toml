[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "typst-forge"
version = "0.2.0"
description = "A local manager for Typst templates and packages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0,<3"]

[project.scripts]
typst-forge = "typst_forge.cli:main"
typst-forge-mcp = "typst_forge.mcp:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["typst_forge", "typst_forge.*"]
